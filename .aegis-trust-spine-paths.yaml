# .aegis-trust-spine-paths.yaml — §44 Phase 2 trust-spine carve-out source-of-truth
#
# Cosmic-flute §54 (task #271, pulled forward from Phase 3 per §54 D1). Read by
# the `aggregator-approve` job in .github/workflows/ai-second-review.yml: a PR
# that touches ANY path matching these globs is NEVER auto-approved by the
# `aegis-auto-reviewer` machine-user — it requires human review + the manual
# §34.17.2 bypass cycle.
#
# DEFENSE IN DEPTH (two independent layers per §54.9):
#   1. THIS file — the aggregator script refuses to post an auto-approval when
#      any changed file matches a trust_spine_glob (fail-closed: a parse error
#      or unreadable file is treated as "trust-spine touched" → block).
#   2. .github/CODEOWNERS — the machine-user `@aegis-auto-reviewer` is added
#      ONLY to the `*` default line, NOT to any trust-spine path-specific entry.
#      GitHub's "more-specific pattern wins" rule means the machine-user is NOT
#      a code-owner for these paths, so its approval cannot satisfy
#      `require_code_owner_review` on a trust-spine PR even if the script layer
#      were bypassed. The two layers MUST stay in sync — these globs mirror the
#      CODEOWNERS trust-spine entries exactly.
#
# A future Phase-3 hardening (§54.12, D7) may add suzuki-shunsuke/validate-pr-
# review-action as a third, platform-enforced layer scoped to these same paths.

version: 1

# Mirror of .github/CODEOWNERS trust-spine path-specific entries (keys/, schema/,
# policy/, .github/, docs/architecture/, scripts/). Glob form `prefix/**` — the
# aggregator matches a changed file F as trust-spine when F == prefix OR F starts
# with `prefix/`.
trust_spine_globs:
  - "keys/**"
  - "schema/**"
  - "policy/**"
  - ".github/**"
  - "docs/architecture/**"
  - "scripts/**"
  # Verifier-kit composite Action — the externally-consumed verify-aegis-attestation
  # composite that pins the canonical signing keys + policy/verifier-policy-v1.yaml and
  # runs the offline attestation verification. Trust-spine material (QG-§54 audit:
  # closes the actions/ fall-through that BOTH layers previously missed).
  - "actions/**"
  # Self-protection: a PR that edits THIS carve-out file is itself human-only.
  # Without this, a PR could weaken the carve-out (remove keys/** etc.) on a
  # top-level routine-classified file + auto-approve the weakening. Two defenses
  # combine: (1) the aggregator reads this file from the TRUSTED base.sha (so the
  # PR's edited version never takes effect for its own gate), and (2) this glob
  # routes any PR touching it to human review. CODEOWNERS MUST also protect this
  # path when @aegis-auto-reviewer is added (§44 Phase 2 #266) so the two
  # defense layers stay mirrored.
  - ".aegis-trust-spine-paths.yaml"

  # Supply-chain dep files (cosmic-flute §54 Q2: close the residual auto-approve
  # gap; mirrored in .github/CODEOWNERS as human-only `/`-anchored lines). Bare
  # filenames — the aggregator matchesGlob() falls through to `file === glob` for a
  # no-wildcard entry, matching the repo-root file exactly. requirements-dev.txt
  # exists today; the rest are a forward-proof superset (a glob for an absent file
  # never fires until that file is created — harmless).
  - "requirements-dev.txt"
  # Hash-pinned lockfiles + the aux source — what CI actually installs
  # (requirements-ci.txt: tests.yml + both parity workflows;
  # requirements-aux-ci.txt: lint.yml + aegis-shadow-eval.yml +
  # resolve-callee-parity.yml), so a quiet edit to any of them IS a
  # dependency swap. Mirrored in .github/CODEOWNERS.
  - "requirements-ci.txt"
  - "requirements-aux.txt"
  - "requirements-aux-ci.txt"
  - "requirements-verify.txt"
  - "requirements-verify-ci.txt"
  - "requirements.txt"
  - "pyproject.toml"
  - "Makefile"
  - "package.json"
  - "package-lock.json"
  # Uncommon Python build/dep manifests — forward-proof superset (QG-§54 audit
  # LOW: none exist today; harmless globs that never fire until the file is created).
  - "setup.py"
  - "setup.cfg"
  - "Pipfile"
  - "poetry.lock"
  - "tox.ini"

  # Root CI / governance config (QG-§54 audit MEDIUM: close the root-config
  # fall-through). .gitignore is a plausible secret-un-ignore vector; .afa.yaml is
  # AFA gate-check config; .markdownlint.json tunes a CI lint. Bare filenames →
  # matchesGlob file===glob exact match. Mirrored in .github/CODEOWNERS.
  - ".gitignore"
  - ".afa.yaml"
  - ".markdownlint.json"

  # Test-suite config — controls test SELECTION (pytest markers + addopts). A
  # one-line `addopts = -m "not <marker>"` edit can deselect the whole suite
  # with every check green, so it is trust-spine like the dep manifests.
  # Mirrored in .github/CODEOWNERS. (Introduced in #36 without this protection;
  # closed here.)
  - "pytest.ini"

# NOTE: as of cosmic-flute §54 Q2 + the QG-§54 adversarial audit, the carve-out
# covers: the 6 trust-spine dirs (keys/, schema/, policy/, .github/, docs/architecture/,
# scripts/) + the verifier-kit composite (actions/**) + this self-protection file +
# the supply-chain dep/build manifests (incl. the requirements-ci.txt lockfile CI
# installs) + root CI/governance config (.gitignore, .afa.yaml, .markdownlint.json)
# + test-selection config (pytest.ini) — each mirrored as a human-only entry in
# .github/CODEOWNERS, keeping the two defense layers in lockstep per §54.9.
#
# DELIBERATE risk-acceptance (QG-§54 audit LOW, documented not closed): non-ADR docs
# under docs/ (governance.md, release-discipline.md, key-rotation-runbook.md, roadmap.md)
# remain ROUTINE (auto-approvable). Rationale: they are documentation (not executable
# trust-material), are reviewed by the 3-AI consensus panel, CODEOWNERS cannot express
# "docs/** except roadmap.md" (no negation), and docs/roadmap.md MUST stay routine for
# the §44 Phase-2 #267 validation. docs/architecture/ (the ADR canonical record) stays
# human-only. A future hardening may enumerate specific governance docs if warranted.
