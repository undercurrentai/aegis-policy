# AEGIS Verifier Policy v1
#
# Canonical source-of-truth for the verifier kit (Sprint 5/E2) + reusable
# workflow (Sprint 5/E3). Consumers pin this file by IMMUTABLE COMMIT SHA;
# never by `@main`. Immutability is enforced by GitHub rulesets + CODEOWNERS
# on this repo (per cosmic-flute §17 Critical 3 + ADR-011 §Negative §6).
#
# Derivation: see policy/PROVENANCE.md
# Version tracking: see policy/CHANGELOG.md (independent of repo-level CHANGELOG)
# Schema reference: schema/attestation_predicate_v1.yaml (vendored from aegis-governance@7e422b2)

policy_version: "2.1.0"
spec_uri: "https://aegis.undercurrentholdings.com/policy/verifier/v1"

# ─────────────────────────────────────────────────────────────────────────────
# Cryptographic requirements (per ADR-011 §Decision + upstream ADR-012)
# ─────────────────────────────────────────────────────────────────────────────
crypto:
  required_algorithms:
    - "ed25519"
    - "ml-dsa-65"
  verification_rule: "AND-of-2"        # both signatures MUST verify (fail-closed if either fails)
  context_string: "aegis-attestation-v1"  # 16 ASCII bytes; binds signatures to AEGIS-attestation purpose
  payload_type: "application/vnd.in-toto+json"
  ed25519_keyid_prefix: "ed25519:"
  mldsa65_keyid_prefix: "ml-dsa-65:"
  ed25519_public_size_bytes: 32
  mldsa65_public_size_bytes: 1952
  # Uniform prefix-hash-and-sign for BOTH algorithms per ADR-012 §"Context-string
  # binding under KMS": GCP KMS asymmetric_sign API does NOT expose FIPS 204
  # ctx-string parameter, so the verifier computes H(CONTEXT_STRING || PAE)
  # and signs that 32-byte digest for both Ed25519 and ML-DSA-65. Empirically
  # verified 2026-05-10 via Phase 4a smoke probe.
  ed25519_binding: "hash_and_sign"     # H(context || pae); Ed25519 doesn't natively support ctx-strings
  mldsa65_binding: "prefix_hash_sign"  # H(context || pae) → ML-DSA-65 plain sign (NOT verify_with_ctx_str per ADR-012)

# ─────────────────────────────────────────────────────────────────────────────
# Pinned canonical public-key fingerprints (PLACEHOLDERS until E1.5 ceremony)
# ─────────────────────────────────────────────────────────────────────────────
required_keyids:
  # SHA-256 hex (lowercase, 64 chars) computed over RAW key bytes (not PEM).
  # For Ed25519: SHA-256 over the 32B raw extracted from keys/ed25519-public.pem
  #              via cryptography.serialization.load_pem_public_key().public_bytes(
  #              Encoding.Raw, PublicFormat.Raw).
  # For ML-DSA-65: SHA-256 directly over the 1952B raw in keys/mldsa65-public.bin
  #                (the file IS the raw; extraction from the X.509 PEM lives in
  #                scripts/extract_mldsa65_raw.py for future rotations).
  # Ceremony captured 2026-05-10 from GCP KMS keyring `aegis-attestation` in
  # `undercurrent-production`, us-central1, version 1 of each key. See ADR-002.
  ed25519: "33378f58b12a92488fd57888323b77fef2ffd9bd051c10768fc770c02025d97d"
  mldsa65: "f4e65bb77a508e82cd60b576075866d3e6447f4d3fd841ef1c3f1b93ecbe7d93"
# The fingerprint-parity gate (scripts/check_fingerprints.py +
# .github/workflows/fingerprint-parity.yml; added in C5) enforces the bytes ↔
# fingerprints invariant on every subsequent PR touching keys/ or this file.

# ─────────────────────────────────────────────────────────────────────────────
# Required predicate-binding fields (per ADR-011 §Decision + §lines 217-231)
# Mismatch = hard fail (fail-closed).
# ─────────────────────────────────────────────────────────────────────────────
required_context_bindings:
  - repository
  - workflow_ref
  - run_id
  - run_attempt
  - environment
  - subject_digest

required_predicate_fields:
  - decision_id
  - artifact_digest
  - environment
  - risk_class
  - policy_version
  - issued_at
  - expires_at
  - gate_pass_states

# ─────────────────────────────────────────────────────────────────────────────
# TTL policy per risk_class (quarterly-revisited; see review_cadence below)
# ─────────────────────────────────────────────────────────────────────────────
# Defaults derived from interface-contract-attestation-v1.2.0.yaml's
# `initial_defaults_hours` block (low/medium 24h, high/critical 4h there).
# This artifact tightens high+critical to 1h to match the safety margin
# documented in cosmic-flute §26.6 + ADR-011 §lines 217-231.
# NEXT REVIEW: 2026-08-09 (90 days from 2026-05-09 ship)
ttl_per_risk_class:
  low: "24h"
  medium: "24h"
  high: "1h"
  critical: "1h"
review_cadence: "quarterly"  # MUST review against measured P99 pipeline duration + approval SLA
re_attestation_allowed: true  # same artifact_digest with new nonce + new expires_at is permitted

# ─────────────────────────────────────────────────────────────────────────────
# Nonce policy
# ─────────────────────────────────────────────────────────────────────────────
nonce_required_for_risk_classes:
  - high
  - critical
nonce_byte_length: 32  # 256-bit per ADR-011

# ─────────────────────────────────────────────────────────────────────────────
# Fail-closed conditions
# Each entry MUST correspond to an error_class string returned by the SDK's
# `verify_attestation_locally()`. The `error-class-parity.yml` CI workflow
# enforces SDK ↔ policy parity automatically on every PR.
#
# The right-hand comment column maps snake_case (canonical here) to the SDK's
# PascalCase error_class string (`aegis-sdk/src/aegis/_verify_local.py`).
# 15 entries — matches the post-Sprint-4/D2-audit SDK at main `37f8608`.
# (Cosmic-flute §26.18: Ultraplan suggested dropping `signature_set_incomplete`
# on the assumption it still raised ValueError, but the F5 audit-pass remediation
# returns it as an error_class. SDK source is the source-of-truth.)
# ─────────────────────────────────────────────────────────────────────────────
fail_closed_on:
  - payload_type_mismatch          # AttestationPayloadTypeMismatch
  - signature_set_incomplete       # AttestationSignatureSetIncomplete (envelope shape: wrong sig count or missing keyid prefix)
  - payload_decode_failed          # AttestationPayloadDecodeFailed
  - payload_json_invalid           # AttestationPayloadJsonInvalid
  - canonical_bytes_mismatch       # AttestationCanonicalBytesMismatch
  - statement_shape_invalid        # AttestationStatementShapeInvalid
  - ed25519_sig_decode_failed      # AttestationEd25519SigDecodeFailed
  - ed25519_verify_failed          # AttestationEd25519VerifyFailed
  - mldsa_sig_decode_failed        # AttestationMLDSASigDecodeFailed
  - mldsa_verify_failed            # AttestationMLDSAVerifyFailed
  - subject_missing                # AttestationSubjectMissing
  - digest_mismatch                # AttestationDigestMismatch
  - environment_mismatch           # AttestationEnvironmentMismatch
  - expires_at_malformed           # AttestationExpiresAtMalformed
  - expired                        # AttestationExpired

# ─────────────────────────────────────────────────────────────────────────────
# Compatibility mode (per ADR-011 N3)
# ─────────────────────────────────────────────────────────────────────────────
# v1 default: strict-equal — consumer's pinned policy_version MUST equal this
# file's policy_version exactly. Future versions may relax to semver-major-equal
# if churn justifies it. Enforcement happens in the E2 verifier kit, not at E1.
policy_version_compatibility: "strict-equal"

# ─────────────────────────────────────────────────────────────────────────────
# Replay-detection contract (added v2.1.0 — Sprint 5/E2 task #119)
# ─────────────────────────────────────────────────────────────────────────────
# Per ADR-001 §"Consumer-owned replay-detection responsibility" + upstream
# aegis-governance ADR-011 §"Verifier statelessness". AEGIS verifier
# (server-side /attestations/verify + SDK offline verify_attestation_locally)
# is STATELESS by design. Replay detection is consumer-owned.
#
# This block is a CONTRACT, not a fail_closed_on entry. The composite-action-
# layer emits `AttestationReplayDetected` when replay-store-path is set and
# decision_id is found duplicate — that string lives in the action README,
# NOT in fail_closed_on (preserves SDK ↔ policy parity invariant at 15 vs 15).
replay_detection:
  policy: "consumer-owned"
  mechanism_primary: "decision-id-uniqueness"    # all risk classes
  mechanism_secondary: "nonce-uniqueness"        # high/critical risk_class (nonce always present)
  enforcement_layer: "consumer-ci-workflow"       # NOT server-side; NOT in SDK
  recommended_stores:
    - "append-only file (e.g., .github/.aegis-replay.log committed to consumer repo)"
    - "DB unique constraint on (decision_id) or (nonce)"
    - "Redis SETNX with TTL aligned to predicate.governance.expires_at"
  composite_action_support:
    action_ref: "undercurrentai/aegis-policy/actions/verify-aegis-attestation@<sha>"
    input: "replay-store-path"
    behavior_when_unset: "step emits ::warning:: + verify proceeds; consumer must implement detection externally"
    behavior_when_set: "action consults the path, appends decision_id on success, fails with AttestationReplayDetected on duplicate"
  references:
    adr_001: "docs/architecture/adr/ADR-001-repo-trust-model.md"
    adr_011_upstream: "https://github.com/undercurrentai/aegis-governance/blob/main/docs/architecture/adr/ADR-011-artifact-bound-aegis-attestations.md"
    cosmic_flute: "internal: ~/.claude/plans/let-s-plan-this-cosmic-flute.md §34"

# ─────────────────────────────────────────────────────────────────────────────
# References
# ─────────────────────────────────────────────────────────────────────────────
references:
  adr_011: "https://github.com/undercurrentai/aegis-governance/blob/main/docs/architecture/adr/ADR-011-artifact-bound-aegis-attestations.md"
  predicate_schema: "schema/attestation_predicate_v1.yaml"
  interface_contract: "schema/interface-contract-attestation-v1.2.0.yaml"
  sdk_verify_local: "https://github.com/undercurrentai/aegis-governance/blob/main/aegis-sdk/src/aegis/_verify_local.py"
  cosmic_flute_section: "internal: ~/.claude/plans/let-s-plan-this-cosmic-flute.md §17 Critical 3 + §26"
