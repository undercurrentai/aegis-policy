# AEGIS Verifier Policy v1 — TEST POLICY for Sprint 5/E2 self-test fixtures.
# Generated by tests/fixtures/generate_fixtures.py.
# Mirrors production policy/verifier-policy-v1.yaml but with EPHEMERAL
# test-key fingerprints under required_keyids. Loaded only when
# AEGIS_POLICY_PATH_OVERRIDE points here (self-test workflow only).

policy_version: 2.1.0
spec_uri: https://aegis.undercurrentholdings.com/policy/verifier/v1
crypto:
  required_algorithms:
  - ed25519
  - ml-dsa-65
  verification_rule: AND-of-2
  context_string: aegis-attestation-v1
  payload_type: application/vnd.in-toto+json
  ed25519_keyid_prefix: 'ed25519:'
  mldsa65_keyid_prefix: 'ml-dsa-65:'
  ed25519_public_size_bytes: 32
  mldsa65_public_size_bytes: 1952
  ed25519_binding: hash_and_sign
  mldsa65_binding: prefix_hash_sign
required_keyids:
  ed25519: ff15bbda193e6c5b4137181bffdb35d0c226841f9b31a8ca81f3ea227d333b88
  mldsa65: 52341bdb0962c55315b5a6f38a0dc1fb6912f6a126a011aa40879e642cb73c66
required_context_bindings:
- repository
- workflow_ref
- run_id
- run_attempt
- environment
- subject_digest
required_predicate_fields:
- decision_id
- artifact_digest
- environment
- risk_class
- policy_version
- issued_at
- expires_at
- gate_pass_states
ttl_per_risk_class:
  low: 24h
  medium: 24h
  high: 1h
  critical: 1h
review_cadence: quarterly
re_attestation_allowed: true
nonce_required_for_risk_classes:
- high
- critical
nonce_byte_length: 32
fail_closed_on:
- payload_type_mismatch
- signature_set_incomplete
- payload_decode_failed
- payload_json_invalid
- canonical_bytes_mismatch
- statement_shape_invalid
- ed25519_sig_decode_failed
- ed25519_verify_failed
- mldsa_sig_decode_failed
- mldsa_verify_failed
- subject_missing
- digest_mismatch
- environment_mismatch
- expires_at_malformed
- expired
policy_version_compatibility: strict-equal
replay_detection:
  policy: consumer-owned
  mechanism_primary: decision-id-uniqueness
  mechanism_secondary: nonce-uniqueness
  enforcement_layer: consumer-ci-workflow
  recommended_stores:
  - append-only file (e.g., .github/.aegis-replay.log committed to consumer repo)
  - DB unique constraint on (decision_id) or (nonce)
  - Redis SETNX with TTL aligned to predicate.governance.expires_at
  composite_action_support:
    action_ref: undercurrentai/aegis-policy/actions/verify-aegis-attestation@<sha>
    input: replay-store-path
    behavior_when_unset: 'step emits ::warning:: + verify proceeds; consumer must
      implement detection externally'
    behavior_when_set: action consults the path, appends decision_id on success, fails
      with AttestationReplayDetected on duplicate
  references:
    adr_001: docs/architecture/adr/ADR-001-repo-trust-model.md
    adr_011_upstream: https://github.com/undercurrentai/aegis-governance/blob/main/docs/architecture/adr/ADR-011-artifact-bound-aegis-attestations.md
    cosmic_flute: "internal: ~/.claude/plans/let-s-plan-this-cosmic-flute.md \xA7\
      34"
references:
  adr_011: https://github.com/undercurrentai/aegis-governance/blob/main/docs/architecture/adr/ADR-011-artifact-bound-aegis-attestations.md
  predicate_schema: schema/attestation_predicate_v1.yaml
  interface_contract: schema/interface-contract-attestation-v1.2.0.yaml
  sdk_verify_local: https://github.com/undercurrentai/aegis-governance/blob/main/aegis-sdk/src/aegis/_verify_local.py
  cosmic_flute_section: "internal: ~/.claude/plans/let-s-plan-this-cosmic-flute.md\
    \ \xA717 Critical 3 + \xA726"
