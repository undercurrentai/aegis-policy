version: 2
updates:
  # GitHub Actions used in our workflows (lint, AEGIS shadow-eval, error-class parity)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Python deps for the error-class parity check script (aegis-governance[verify] + yamllint, etc.)
  # Runs in CI; bumps gate the parity invariant against latest SDK error_class taxonomy.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
