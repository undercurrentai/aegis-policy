# AEGIS Governance Gate — INTERNAL composite action
#
# ⚠️  INTERNAL IMPLEMENTATION DETAIL — do NOT consume this composite directly.
# Consumer repos MUST use the reusable workflow as the single supported public
# entry point:
#     uses: undercurrentai/aegis-policy/.github/workflows/aegis-enforce.yml@<SHA>
# The reusable workflow owns the §48 enforce-substrate CI/CD-domain default
# profile, the Checks-API attachment, and the shadow/enforce mode plumbing. This
# composite carries only bare-minimum defaults and is invoked ONLY by
# aegis-enforce.yml. Calling it directly bypasses that profile — its divergent
# defaults will produce different verdicts for the same inputs (cosmic-flute §51 /
# QG48-D1: collapses the two-public-entry-point footgun to one entry point;
# QG48-D2/D4/D7 likewise only bite the unsupported direct-composite path).
#
# Evaluates a proposal against AEGIS governance gates via the Cloud Run API.
# Returns PROCEED / PAUSE / HALT / ESCALATE with confidence and rationale.

name: 'AEGIS Governance Gate'
description: 'INTERNAL — evaluate a proposal against AEGIS gates (use the aegis-enforce.yml reusable workflow, not this composite directly)'

inputs:
  api_key:
    description: 'AEGIS API key (from portal.undercurrentholdings.com). Store as a GitHub secret.'
    required: true
  api_url:
    description: 'AEGIS API base URL'
    required: false
    default: 'https://api.aegis.undercurrentholdings.com'
  proposal_summary:
    description: 'Brief description of the proposed change'
    required: true
  estimated_impact:
    description: 'Impact level: low, medium, high, critical'
    # QG48-D2: was `required: true` WITH a default (contradiction — a default
    # makes the input effectively optional). Internal composite; the
    # aegis-enforce.yml reusable workflow always supplies estimated_impact.
    required: false
    default: 'medium'
  change_type:
    description: 'Change type: feature, refactor, bugfix, config'
    required: false
    default: 'feature'
  risk_score:
    # QG48-D4: INTERNAL proposed-risk input. The aegis-enforce.yml reusable
    # workflow maps its `risk_proposed` input here (`risk_score: ${{ inputs.risk_proposed }}`)
    # and the API payload sends it as `risk_proposed`. Named `risk_score` (not
    # `risk_proposed`) for legacy reasons — an unsupported direct-composite
    # caller setting `risk_proposed` would be silently ignored (→ default 0.0).
    description: 'INTERNAL proposed-risk input (0.0 - 1.0); reusable workflow maps risk_proposed here.'
    required: false
    default: '0.0'
  risk_baseline:
    description: 'Risk baseline (0.0 - 1.0)'
    required: false
    default: '0.0'
  profit_proposed:
    description: 'Proposed profit metric'
    required: false
    default: '0.0'
  profit_baseline:
    description: 'Profit baseline metric'
    required: false
    default: '0.0'
  novelty_score:
    description: 'Novelty score (0.0 - 1.0)'
    required: false
    default: '0.5'
  complexity_score:
    # QG48-D7: floor 0.5 is an IMMUTABLE hard gate (AEGIS rejects below 0.5);
    # this default sits ON the floor, so an unsupported direct-composite caller
    # that omits it lands at the rejection boundary. The aegis-enforce.yml
    # reusable workflow supplies a richer default (0.75) + derivation guidance.
    description: 'Complexity score (0.0 - 1.0, HIGHER = SIMPLER; floor 0.5 IMMUTABLE)'
    required: false
    default: '0.5'
  quality_score:
    description: 'Quality score (0.0 - 1.0)'
    required: false
    default: '0.7'
  agent_id:
    description: 'Agent/caller identifier'
    required: false
    default: 'github-actions'
  fail_on_halt:
    description: 'Fail the workflow if AEGIS returns HALT'
    required: false
    default: 'true'

outputs:
  status:
    description: 'AEGIS decision status (proceed, pause, halt, escalate)'
    value: ${{ steps.evaluate.outputs.status }}
  confidence:
    description: 'Decision confidence score'
    value: ${{ steps.evaluate.outputs.confidence }}
  rationale:
    description: 'Decision rationale'
    value: ${{ steps.evaluate.outputs.rationale }}
  decision_json:
    description: 'Full decision JSON'
    value: ${{ steps.evaluate.outputs.decision_json }}

runs:
  using: 'composite'
  steps:
    - name: Evaluate proposal
      id: evaluate
      shell: bash
      env:
        AEGIS_API_KEY: ${{ inputs.api_key }}
        AEGIS_API_URL: ${{ inputs.api_url }}
        INPUT_PROPOSAL_SUMMARY: ${{ inputs.proposal_summary }}
        INPUT_ESTIMATED_IMPACT: ${{ inputs.estimated_impact }}
        INPUT_CHANGE_TYPE: ${{ inputs.change_type }}
        INPUT_RISK_SCORE: ${{ inputs.risk_score }}
        INPUT_RISK_BASELINE: ${{ inputs.risk_baseline }}
        INPUT_PROFIT_PROPOSED: ${{ inputs.profit_proposed }}
        INPUT_PROFIT_BASELINE: ${{ inputs.profit_baseline }}
        INPUT_NOVELTY_SCORE: ${{ inputs.novelty_score }}
        INPUT_COMPLEXITY_SCORE: ${{ inputs.complexity_score }}
        INPUT_QUALITY_SCORE: ${{ inputs.quality_score }}
        INPUT_AGENT_ID: ${{ inputs.agent_id }}
      run: |
        set -euo pipefail

        # QG48-9: per-invocation temp file (was a fixed /tmp/aegis-response.json —
        # concurrent jobs on a persistent self-hosted runner would race + leak
        # cross-PR verdicts). mktemp + EXIT-trap cleanup.
        RESPONSE_FILE=$(mktemp)
        trap 'rm -f "${RESPONSE_FILE}"' EXIT

        # Build proposal payload (uses env vars to prevent script injection)
        PAYLOAD=$(python3 -c "
        import json, os
        body = {
            'proposal_summary': os.environ['INPUT_PROPOSAL_SUMMARY'],
            'estimated_impact': os.environ['INPUT_ESTIMATED_IMPACT'],
            'change_type': os.environ['INPUT_CHANGE_TYPE'],
            'risk_proposed': float(os.environ['INPUT_RISK_SCORE']),
            'risk_baseline': float(os.environ['INPUT_RISK_BASELINE']),
            'profit_proposed': float(os.environ['INPUT_PROFIT_PROPOSED']),
            'profit_baseline': float(os.environ['INPUT_PROFIT_BASELINE']),
            'novelty_score': float(os.environ['INPUT_NOVELTY_SCORE']),
            'complexity_score': float(os.environ['INPUT_COMPLEXITY_SCORE']),
            'quality_score': float(os.environ['INPUT_QUALITY_SCORE']),
            'agent_id': os.environ['INPUT_AGENT_ID'],
        }
        print(json.dumps(body))
        ")

        # Call AEGIS Cloud Run API.
        # QG48-6: --retry + --connect-timeout so a transient network blip retries
        # instead of false-failing (shadow swallows it; enforcing would block merge).
        # QG48-7: capture curl rc explicitly (errexit-safe) so an empty / non-200
        # HTTP_CODE produces a clear fail-closed error, not a numeric-compare crash.
        set +e
        HTTP_CODE=$(curl -s -o "${RESPONSE_FILE}" -w "%{http_code}" \
          -X POST "${AEGIS_API_URL}/evaluate" \
          -H "Authorization: Bearer ${AEGIS_API_KEY}" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}" \
          --connect-timeout 10 --max-time 30 \
          --retry 3 --retry-delay 2 --retry-connrefused)
        CURL_RC=$?
        set -e

        if [ "${CURL_RC}" -ne 0 ] || [ -z "${HTTP_CODE}" ] || [ "${HTTP_CODE}" != "200" ]; then
          echo "::error::AEGIS API call failed (curl rc=${CURL_RC}, http=${HTTP_CODE:-none})"
          # QG48-4: redact Bearer / key-like tokens + truncate the response body
          # before echoing to the PUBLIC-repo Actions log.
          sed -E 's/(Bearer|Authorization|sk-|uk_)[A-Za-z0-9._-]+/[REDACTED]/gI' "${RESPONSE_FILE}" | head -c 2000 || true
          echo ""
          exit 1
        fi

        # Parse response.
        DECISION=$(cat "${RESPONSE_FILE}")
        # QG48-8: fail-CLOSED on a malformed 200 — .get('status','') default +
        # an explicit empty-status guard. A missing 'status' key would otherwise
        # leave STATUS empty and the gate would silently pass (fail-open).
        # (A non-JSON body makes json.load raise → set -e exits non-zero, also
        # fail-closed.)
        STATUS=$(printf '%s' "${DECISION}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
        CONFIDENCE=$(printf '%s' "${DECISION}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('confidence', 'N/A'))")
        RATIONALE=$(printf '%s' "${DECISION}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('rationale', 'N/A'))")

        if [ -z "${STATUS}" ]; then
          echo "::error::AEGIS response (HTTP 200) is missing the 'status' field — malformed; fail-closed"
          exit 1
        fi

        # QG48-1: random per-run GITHUB_OUTPUT heredoc delimiters so untrusted
        # rationale / decision text cannot break out of the heredoc to inject
        # arbitrary step outputs. A 32-hex-char delimiter collision is negligible.
        DELIM_R="AEGIS_EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
        DELIM_J="AEGIS_JSON_EOF_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
        {
          echo "status=${STATUS}"
          echo "confidence=${CONFIDENCE}"
          echo "rationale<<${DELIM_R}"
          echo "${RATIONALE}"
          echo "${DELIM_R}"
          echo "decision_json<<${DELIM_J}"
          echo "${DECISION}"
          echo "${DELIM_J}"
        } >> "$GITHUB_OUTPUT"

        # Summary. QG48-10: collapse newlines + escape `|` in RATIONALE so it
        # cannot break the markdown table or inject extra rows.
        RATIONALE_MD=$(printf '%s' "${RATIONALE}" | tr '\n' ' ' | sed 's/|/\\|/g')
        {
          echo "### AEGIS Governance Decision"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| **Status** | \`${STATUS}\` |"
          echo "| **Confidence** | ${CONFIDENCE} |"
          echo "| **Rationale** | ${RATIONALE_MD} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Check gate result
      if: inputs.fail_on_halt == 'true'
      shell: bash
      env:
        GATE_STATUS: ${{ steps.evaluate.outputs.status }}
        GATE_RATIONALE: ${{ steps.evaluate.outputs.rationale }}
      run: |
        set -euo pipefail
        # QG48-3: case-insensitive HALT compare. The API may return "HALT" or
        # "halt"; the github-script conclusionMap in aegis-enforce.yml lowercases,
        # but this composite previously compared case-sensitively against "halt"
        # — an upper/mixed-case HALT would slip through (fail-open) in enforcing mode.
        GATE_STATUS_LC=$(printf '%s' "${GATE_STATUS}" | tr '[:upper:]' '[:lower:]')
        if [ "${GATE_STATUS_LC}" = "halt" ]; then
          echo "::error::AEGIS governance gate returned HALT: ${GATE_RATIONALE}"
          exit 1
        fi
        echo "AEGIS governance gate passed: ${GATE_STATUS}"
