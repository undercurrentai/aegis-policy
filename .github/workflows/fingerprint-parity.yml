name: Fingerprint Parity

# Cross-checks `policy/verifier-policy-v1.yaml required_keyids` against the
# SHA-256 of the bytes in `keys/`. Fails the PR if either side drifts from
# the other. This is the trust-spine-integrity gate: prevents the
# "single-char fingerprint typo causes live deploy outage" failure mode
# (cosmic-flute §28.5 box 7 + §30 §3.1).
#
# Counterpart of error-class-parity.yml. Sprint 5/E1.5 Phase 5 C5.

on:
  pull_request:
    branches:
      - main
    # NO `paths:` filter — deliberately, per cosmic-flute §48.15 R2, the same
    # anti-skipped-check-hang rule aegis-enforce-caller.yml already carries:
    # this job is a REQUIRED status check in org ruleset 16294975, and a
    # required check that never reports sits at "Expected" forever. The old
    # filter made every PR touching none of the filtered paths structurally
    # unmergeable in-band — verified on #33, #34, #35, each missing 2 of 5
    # required checks. The job is ~8s and asserts a repo-state invariant, so
    # it passes on any PR regardless of what that PR changed. Guarded by
    # tests/test_workflow_invariants.py::TestRequiredCheckWorkflowsHaveNoPathsFilter.
  push:
    branches:
      - main
    # push keeps its path scope: post-merge visibility for direct/admin pushes
    # that touch the gate's inputs. The pull_request trigger above is
    # deliberately UNFILTERED (it is a required check — see the note there),
    # so PR coverage is a strict superset of this list and the old "mirror the
    # pull_request paths exactly" rule no longer applies in that direction.
    paths:
      - "policy/verifier-policy-v1.yaml"
      - "keys/**"
      - "scripts/check_fingerprints.py"
      - ".github/workflows/fingerprint-parity.yml"
      - "requirements-dev.txt"
      - "requirements-ci.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: keys/ ↔ required_keyids SHA-256 parity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Measured runtime ~8s; the job now runs on EVERY PR (required check), so
    # an unbounded hang would burn the 360-minute default on a billed runner.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install dev deps (hash-pinned)
        # Needs `cryptography` for Ed25519 PEM → raw 32B extraction, plus
        # `pyyaml` to load policy/verifier-policy-v1.yaml. ML-DSA-65 bytes
        # are already raw on disk (keys/mldsa65-public.bin) — no extraction
        # at gate time. The X.509 ASN.1 extraction utility
        # (scripts/extract_mldsa65_raw.py) is for key-rotation operators,
        # not the parity gate.
        #
        # requirements-ci.txt is the hash-pinned lockfile compiled from the
        # dev requirements — see its header for the threat model and the
        # regeneration command. No `pip install --upgrade pip` either: that
        # was itself an unpinned live-PyPI install, the class this closes.
        # --only-binary=:all: closes the hashed-sdist fallback (build deps
        # would arrive unpinned from live PyPI); see tests.yml for detail.
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-ci.txt
          python -m pip check

      - name: Run fingerprint-parity check
        run: python scripts/check_fingerprints.py
