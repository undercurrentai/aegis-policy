name: resolve_callee parity + Node tests

# Sprint 7/G1 task #185 F2.2 closure (cosmic-flute §45.12.5.3).
#
# Three layered checks:
#   1. PARITY: extracts the inline `script: |` body from the resolve_callee
#      step in aegis-verify-attestation.yml + the body between
#      // === BEGIN_INLINE_PARITY === / === END_INLINE_PARITY === markers
#      in .github/scripts/resolve_callee.mjs, diffs them byte-for-byte.
#      Mismatch = build failure. This is the load-bearing invariant: the
#      .mjs file (which the Node test harness imports) MUST stay in sync
#      with the inline body (which runs in production CI).
#   2. NODE TESTS: runs the 9-test harness in tests/test_verify_attestation_node.mjs
#      which exercises each branch of resolve() with mocked Octokit + core.
#   3. INVARIANTS: existing pytest workflow-invariants suite + error-class +
#      fingerprint parity (these run elsewhere; this workflow just adds
#      the resolve_callee-specific gates).
#
# Why a separate workflow (not a job in aegis-verify-attestation.yml):
# aegis-verify-attestation.yml is `on: workflow_call:`-only (the cross-repo
# reusable verifier-kit consumer surface). Adding a parity job to it would
# force every consumer to also run that job. Separate file = separate
# trigger semantics + clean per-PR surface.

on:
  pull_request:
    paths:
      - '.github/workflows/aegis-verify-attestation.yml'
      - '.github/workflows/aegis-enforce.yml'
      - '.github/workflows/resolve-callee-parity.yml'
      - '.github/scripts/resolve_callee.mjs'
      - 'tests/test_verify_attestation_node.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aegis-verify-attestation.yml'
      - '.github/workflows/aegis-enforce.yml'
      - '.github/scripts/resolve_callee.mjs'

permissions:
  contents: read

concurrency:
  group: resolve-callee-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: resolve_callee inline-vs-mjs parity + Node tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python (for PyYAML inline-body extraction)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node (for `node --test` harness)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version: "22"

      - name: Install PyYAML (PR head workspace, hash-pinned)
        # requirements-aux-ci.txt — hash-pinned lockfile (see its header).
        # Bare `pip install "PyYAML>=6.0"` was a latest-version live-PyPI
        # resolution at every run; same drift class as the rest of CI.
        # Block scalar, not a plain one-liner: `--only-binary=:all: -r` holds
        # a `: ` sequence, which YAML forbids inside an unquoted plain scalar.
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-aux-ci.txt
          python -m pip check

      - name: Extract inline YAML bodies + .mjs body
        run: |
          set -euo pipefail
          mkdir -p /tmp/parity
          # §51/QG48-D8: BOTH reusable workflows (aegis-verify-attestation.yml +
          # aegis-enforce.yml) embed the SAME resolve_callee body — the filename
          # is REUSABLE_WORKFLOW_FILENAME-parameterized so a single .mjs is shared.
          # Each inline body MUST be byte-identical to the .mjs marker region.
          # Extract each via PyYAML (strips `script: |` block-scalar common indent).
          python3 - <<'PYEOF' > /tmp/parity/inline-body-verify.js
          import yaml
          with open('.github/workflows/aegis-verify-attestation.yml') as f:
              doc = yaml.safe_load(f)
          for step in doc['jobs']['verify']['steps']:
              if step.get('id') == 'resolve_callee':
                  print(step['with']['script'], end='')
                  break
          PYEOF

          python3 - <<'PYEOF' > /tmp/parity/inline-body-enforce.js
          import yaml
          with open('.github/workflows/aegis-enforce.yml') as f:
              doc = yaml.safe_load(f)
          for step in doc['jobs']['aegis-gate']['steps']:
              if step.get('id') == 'resolve_callee':
                  print(step['with']['script'], end='')
                  break
          PYEOF

          # .mjs body between parity markers (exclusive; markers themselves stripped)
          awk '/=== BEGIN_INLINE_PARITY ===/{flag=1;next}/=== END_INLINE_PARITY ===/{flag=0}flag' \
            .github/scripts/resolve_callee.mjs > /tmp/parity/mjs-body.js

          # U5 (accepted-findings §45 row 33): fail LOUDLY if any extraction came
          # back empty — a renamed step id / job key / marker must surface as
          # "extraction failed", not a misleading huge diff.
          for f in inline-body-verify inline-body-enforce mjs-body; do
            if [ ! -s "/tmp/parity/$f.js" ]; then
              echo "::error::Parity extraction produced empty /tmp/parity/$f.js — a step id, job key, or marker was likely renamed. Fix the extraction before trusting the diff."
              exit 1
            fi
          done

          echo "Line counts:"
          wc -l /tmp/parity/inline-body-verify.js /tmp/parity/inline-body-enforce.js /tmp/parity/mjs-body.js

      - name: Diff inline bodies vs mjs-body (parity gate — both consumers)
        run: |
          set -euo pipefail
          rc=0
          for consumer in verify enforce; do
            if diff "/tmp/parity/inline-body-$consumer.js" /tmp/parity/mjs-body.js; then
              echo "✓ Parity holds ($consumer) — inline YAML body byte-identical to .mjs body between markers."
            else
              echo "::error::Parity gate failed for the $consumer consumer. Its inline resolve_callee body has drifted from .github/scripts/resolve_callee.mjs (between the === BEGIN_INLINE_PARITY === / === END_INLINE_PARITY === markers). Edit the .mjs + BOTH workflow inline bodies together so the Node test harness covers the production code path."
              rc=1
            fi
          done
          exit "$rc"

      - name: Run Node test harness (F2.2 — 9 tests)
        run: node --test tests/test_verify_attestation_node.mjs
