name: Tests

# Runs the repository test suite on every PR.
#
# WHY THIS EXISTS
# ---------------
# Before this workflow, NO workflow ran `tests/`. 90+ tests, including the
# guard that stops an API key reaching a PUBLIC PR comment
# (tests/test_gpt_review_failure_detail.py), executed only on whichever laptop
# happened to run `pytest` by hand. A guard nobody runs is documentation, not
# enforcement — the same absence-of-signal failure this repo has hit
# repeatedly.
#
# TWO JOBS, TWO DEPENDENCY SETS
# -----------------------------
# `pytest` (matrix, REQUIRED): the fast suite, installed from
# requirements-ci.txt. Deselects the 19 `needs_aegis_sdk` tests — that venv
# deliberately excludes the SDK (and httpx/openai) so the deliberate-absence
# stubs keep their meaning.
#
# `verifier-kit` (single leg, ADVISORY): runs exactly those 19 tests
# (tests/test_verify_action.py) against `aegis-governance[verify]==1.0.0`
# from public PyPI, installed from requirements-verify-ci.txt. They hold the
# repo's highest-severity assertions — including the guard proving
# `AEGIS_KEYS_DIR_OVERRIDE`/`AEGIS_POLICY_PATH_OVERRIDE` are ignored unless
# `AEGIS_INTERNAL_FIXTURE_MODE` is set, the defence against a compromised
# prior step redirecting the action at attacker-controlled keys.
#
# HISTORY, because the old premise died quietly: the #36 version of this
# header said those 19 tests "need the private aegis-sdk behind
# AEGIS_SDK_FETCH_TOKEN" and could only run in workflow_dispatch-only
# e2-action-selftest.yml. False on three counts by then: the SDK has been on
# public PyPI since 2026-05-15 (roadmap task #59), that secret has never
# existed in this repo, and e2-action-selftest.yml had zero runs ever. The
# marker was accordingly renamed needs_secrets → needs_aegis_sdk: the
# dependency was never a secret, it was a package, and it stopped being
# private.
#
# ADVISORY STATUS of verifier-kit, stated plainly: its check is NOT in org
# ruleset 16294975 yet. Promotion after ~2 weeks of run history is tracked in
# docs/roadmap.md. Until then a red verifier-kit does not block a merge — do
# not read the required-set green as covering these 19 tests.
#
# Measured on a clean venv (requirements-ci.txt only, no httpx/openai/aegis-sdk):
# 124 passed, 19 deselected, 0 skipped (2026-07-29 — was "92 passed" at #36,
# which was already stale by six invariant tests the moment it merged; treat
# this line as a rough scale marker, not a pinned count).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Test suite (py${{ matrix.python-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Measured runtime is ~14s. The default is 360 minutes on a billed runner,
    # which is what an accidentally-unbounded subprocess would burn.
    timeout-minutes: 10
    strategy:
      # fail-fast stays FALSE and is load-bearing: both matrix legs are
      # required checks in org ruleset 16294975 ("Test suite (py3.12)" and
      # "Test suite (py3.13)"). With fail-fast true, one leg's failure
      # CANCELS its sibling on the same head SHA, and a `cancelled` required
      # check blocks the merge while offering nothing to re-read or re-run in
      # place — a non-obvious wedge. Guarded by tests/test_workflow_invariants.py.
      fail-fast: false
      matrix:
        # 3.12 is what `ai-second-review.yml` actually runs gpt_review.py on;
        # gating only on 3.13 would test a config this repo does not ship.
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies (hash-pinned)
        # requirements-ci.txt is the hash-pinned lockfile compiled from
        # requirements-dev.txt — see its header for the threat model and the
        # regeneration command. `--no-deps --require-hashes` installs exactly
        # the named artifacts and resolves nothing at run time; `pip check`
        # proves the closure is complete. No `pip install --upgrade pip`
        # either: that was itself an unpinned live-PyPI install, the class
        # this step closes.
        #
        # httpx/openai are still deliberately absent:
        # tests/test_gpt_review_failure_detail.py stubs them when absent so its
        # security assertions run in any environment. If a future test genuinely
        # needs a new package, add it to requirements-dev.txt and regenerate
        # the lockfile, so local and CI environments stay aligned.
        # `--only-binary=:all:` closes the hashed-sdist fallback: pip's
        # hash-checking mode accepts a hashed sdist when no compatible wheel
        # exists, then fetches its BUILD dependencies (setuptools et al.) from
        # live PyPI unpinned and unhashed — reproduced during the v1.4.0
        # audit. Wheel-only turns that scenario into a fail-closed error.
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-ci.txt
          python -m pip check

      - name: Run test suite
        # `-m "not needs_aegis_sdk"`, not `--ignore=<path>`: the exclusion is a
        # capability statement that belongs next to the test (pytest.ini), so a
        # future SDK-needing file degrades gracefully instead of turning
        # this job red until someone edits the workflow.
        run: |
          pytest tests/ -m "not needs_aegis_sdk" -q --tb=short \
            --junitxml=pytest-report.xml

      - name: Assert the security guard actually EXECUTED
        # Belt-and-braces against the exact bug this job was created to fix.
        #
        # The first version of this step counted `--collect-only` output. Two
        # independent audits proved that insufficient, and I reproduced both:
        #   * a module-level `pytest.mark.skip` => "13 skipped", exit 0, GREEN,
        #     and collect-only still counts 13 => guard PASSES;
        #   * adding the file to step 1's exclusions => step 1 never runs it,
        #     but step 2 ran the file in isolation and so could never notice.
        # A collected count is not an executed count, and a second invocation
        # cannot observe what the first one did.
        #
        # Reading the JUnit XML that step 1 itself produced closes both holes:
        # it reports what that specific run executed, and a skipped testcase
        # carries a <skipped/> child, so skips are distinguishable from passes.
        # `if: always()` so a red suite still reports whether the guard ran.
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          TARGET, MINIMUM = "test_gpt_review_failure_detail", 20
          try:
              raw = open("pytest-report.xml", "rb").read()
              # This job runs fork-authored code, so treat its own report as
              # untrusted input. stdlib ElementTree ignores external entities
              # but still expands internal ones (billion-laughs). pytest never
              # emits a DTD, so rejecting one outright is free and fail-closed
              # — cheaper than adding defusedxml to every CI install.
              if b"<!DOCTYPE" in raw or b"<!ENTITY" in raw:
                  print("::error::pytest-report.xml contains a DTD; pytest "
                        "never emits one. Refusing to parse.")
                  sys.exit(1)
              root = ET.fromstring(raw)
          except SystemExit:
              raise
          except Exception as exc:  # missing, truncated, or unparseable
              print(f"::error::cannot read pytest-report.xml ({exc}) — "
                    "guard status unknown, failing closed")
              sys.exit(1)

          cases = [tc for tc in root.iter("testcase")
                   if TARGET in (tc.get("classname") or "")]
          executed = [tc for tc in cases if tc.find("skipped") is None]
          print(f"guard tests: collected={len(cases)} executed={len(executed)}")

          if len(executed) < MINIMUM:
              print(f"::error::Expected >={MINIMUM} EXECUTED tests in "
                    f"tests/{TARGET}.py; got {len(executed)} "
                    f"({len(cases) - len(executed)} skipped or absent). The "
                    "API-key redaction guard did not run — do NOT merge on a "
                    "green suite alone.")
              sys.exit(1)
          PY

  verifier-kit:
    # ADVISORY (not in org ruleset 16294975 yet — promotion after ~2 weeks of
    # run history, tracked in docs/roadmap.md). The check name deliberately
    # carries NO "(advisory)" suffix: renaming a check when it is promoted is
    # exactly the mismatch that blocked PR #5 ("AEGIS Shadow Evaluation
    # (advisory)" vs the ruleset's entry); name it once, promote it unchanged.
    name: Verifier kit (py3.13)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Cold path CMake-builds the native liboqs library at first `import oqs`
    # (minutes); the warm path restores it from cache and the pytest run
    # itself is ~3s. Generous ceiling, still far under the billed 360 default.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Restore liboqs native library
        # liboqs-python's wheel is pure Python; the C library it wraps is
        # auto-built into ~/_oqs at first import. Keyed on the lockfile hash
        # so an SDK/wrapper bump invalidates the cache. Deliberately NO
        # restore-keys: a prefix restore could resurrect a stale ~/_oqs
        # across wrapper bumps — exact-key-or-cold-build only.
        #
        # restore/save are SPLIT (not the combined actions/cache) because the
        # combined action saves only when the whole job SUCCEEDS — a red test
        # run or a cancel-in-progress would discard the multi-minute build on
        # exactly the PRs that iterate. The save step below runs right after
        # the build instead.
        id: liboqs-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/_oqs
          key: liboqs-${{ runner.os }}-${{ hashFiles('requirements-verify-ci.txt') }}

      - name: Install verifier kit (hash-pinned)
        # requirements-verify-ci.txt pins aegis-governance[verify]==1.0.0 —
        # public PyPI, the exact version action.yml defaults to and the
        # committed fixtures are proven against. See the lockfile header.
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-verify-ci.txt
          python -m pip check

      - name: Build or restore liboqs
        # Its own step so the cold-build cost is visible and a native-build
        # failure is distinguishable from a test failure.
        run: python -c "import oqs; print('liboqs ready:', oqs.oqs_version())"

      - name: Save liboqs native library
        # Immediately after the build, BEFORE the tests: a completed native
        # build persists even when a test later fails. Skipped on cache hit.
        if: steps.liboqs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/_oqs
          key: liboqs-${{ runner.os }}-${{ hashFiles('requirements-verify-ci.txt') }}

      - name: Run the verifier-kit tests
        # Selected by capability marker, mirroring the matrix job's deselect:
        # the two jobs partition the suite exactly, nothing runs zero times.
        run: |
          pytest tests/ -m needs_aegis_sdk -q --tb=short \
            --junitxml=pytest-verify-report.xml

      - name: Assert the verifier-kit tests actually EXECUTED
        # Same defence as the matrix job's guard step, same reason: a
        # module-level skip (or a marker/selection drift) yields exit 0 and a
        # green job while the 19 highest-severity tests run zero times.
        # Reads the JUnit XML the step above itself produced — executed, not
        # collected. `if: always()` so a red suite still reports guard status.
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          TARGET, MINIMUM = "test_verify_action", 19
          try:
              raw = open("pytest-verify-report.xml", "rb").read()
              # Fork-authored code produced this report — treat as untrusted.
              # pytest never emits a DTD; reject one outright, fail-closed.
              if b"<!DOCTYPE" in raw or b"<!ENTITY" in raw:
                  print("::error::pytest-verify-report.xml contains a DTD; "
                        "pytest never emits one. Refusing to parse.")
                  sys.exit(1)
              root = ET.fromstring(raw)
          except SystemExit:
              raise
          except Exception as exc:
              print(f"::error::cannot read pytest-verify-report.xml ({exc}) "
                    "— guard status unknown, failing closed")
              sys.exit(1)

          cases = [tc for tc in root.iter("testcase")
                   if TARGET in (tc.get("classname") or "")]
          executed = [tc for tc in cases if tc.find("skipped") is None]
          print(f"verifier-kit tests: collected={len(cases)} "
                f"executed={len(executed)}")

          if len(executed) < MINIMUM:
              print(f"::error::Expected >={MINIMUM} EXECUTED tests in "
                    f"tests/{TARGET}.py; got {len(executed)} "
                    f"({len(cases) - len(executed)} skipped or absent). The "
                    "AEGIS_KEYS_DIR_OVERRIDE redirection guard did not run.")
              sys.exit(1)
          PY
