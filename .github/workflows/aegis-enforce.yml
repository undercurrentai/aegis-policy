# AEGIS Governance Gate (Reusable Workflow)
#
# Companion to .github/actions/aegis-gate composite action. Wraps the composite
# call in a reusable workflow so other repos can invoke a single canonical
# evaluation pipeline + Checks API attachment via `uses:` from their own
# workflows.
#
# RELOCATED 2026-05-31 from PRIVATE aegis-governance to PUBLIC aegis-policy (the
# §48 enforce-substrate single source of truth). A PUBLIC caller repo cannot
# call a PRIVATE repo's reusable workflow (GitHub platform restriction), so the
# substrate lives here; aegis-policy consumes it locally via `./` while
# aegis-governance (private) + all G2/G3 consumers call it cross-repo via
# undercurrentai/aegis-policy/...@<SHA> (private/internal -> public is ALLOWED).
# Supersedes PR #190's substrate location. The composite is referenced locally
# as ./.github/actions/aegis-gate. See cosmic-flute §48 + the
# aegis-enforce-caller.yml relocation-pivot header.
#
# Usage from a calling repo (e.g., undercurrent-core, libertas-cicd, AgoraIV).
# Cross-repo `uses:` is fully supported as of cosmic-flute §51 — the reusable
# workflow self-checks-out aegis-policy via the resolve_callee step (job.workflow_*
# primary + referenced_workflows API fallback), so the `./aegis-policy/...`
# composite reference resolves correctly from any caller repo (QG48-15).
#
#   jobs:
#     ci-success:
#       runs-on: ubuntu-latest
#       needs: [lint, test, security]
#       steps:
#         - run: echo "All CI checks passed"
#
#     aegis-gate:
#       # Pin by commit SHA (RECOMMENDED — byte-immutable; pair with Dependabot) or @v1
#       # (convenience moving tag, backward-compatible within v1). NEVER @main. See
#       # docs/release-discipline.md (QG48-D5).
#       uses: undercurrentai/aegis-policy/.github/workflows/aegis-enforce.yml@<SHA>
#       needs: [ci-success]
#       if: needs.ci-success.result == 'success'
#       permissions:           # §51/QG48-5: effective perms = caller ∩ reusable — grant these so the reusable's job has them
#         contents: read
#         checks: write        #   Checks-API verdict attach
#         actions: read        #   referenced_workflows API fallback in resolve_callee (cross-repo self-checkout)
#       secrets:               # QG48-12: pass ONLY the needed secret (NOT `secrets: inherit`)
#         AEGIS_API_KEY: ${{ secrets.AEGIS_API_KEY }}
#       with:
#         shadow_mode: true          # flip to false once calibrated (≥20 PRs, ≥50% PROCEED)
#         proposal_summary: "${{ github.event.pull_request.title }}"
#         estimated_impact: "medium"
#         change_type: "feature"
#         # Parameter derivation defaults below encode the §48 enforce-substrate CI/CD-domain profile.
#         # Calling repos may override for richer accuracy.
#
# Branch-protection required-status-check name: "aegis-gate / AEGIS Governance Gate"
#   (GitHub renders required checks as "<job-id> / <job-name>" for reusable workflows.)
#
# Phase rollout (§48 calibration window; shadow_mode true -> false):
#   - shadow_mode=true  + continue-on-error -> calibration window (~20 PRs minimum)
#   - shadow_mode=false                     -> enforcement (HALT blocks merge)

name: AEGIS Governance Gate (Reusable)

on:
  workflow_call:
    # QG48-D8: this input surface is the SINGLE public contract for AEGIS gating.
    # It is a deliberate 1:1 passthrough to the INTERNAL aegis-gate composite (the
    # canonical metric schema). GitHub Actions has no input-inheritance, so the
    # passthrough is mapped explicitly in the `aegis-gate` step below; treat the
    # composite's action.yml as the schema source of truth when adding inputs.
    inputs:
      shadow_mode:
        type: boolean
        default: true
        description: "true = advisory (continue-on-error). false = enforcing (HALT blocks merge)."
      proposal_summary:
        type: string
        required: true
        description: "Brief description of the proposed change. Typically the PR title."
      estimated_impact:
        type: string
        default: "medium"
        description: "low | medium | high | critical"
      change_type:
        type: string
        default: "feature"
        description: "feature | refactor | bugfix | config"
      risk_baseline:
        type: number
        default: 0.02
        description: "Baseline risk (0.0-1.0). CI/CD-domain default per the §48 enforce-substrate calibration defaults."
      risk_proposed:
        type: number
        default: 0.04
        description: "Proposed risk (0.0-1.0). Suggested derivation: 0.02 + files_changed * 0.002."
      profit_baseline:
        type: number
        default: 0.98
        description: "Baseline test pass rate (0.0-1.0)."
      profit_proposed:
        type: number
        default: 0.98
        description: "Proposed test pass rate (0.0-1.0). Default assumes no regression."
      novelty_score:
        type: number
        default: 0.85
        # QG48-D3: derivation guidance keyed to the change_type enum above
        # (feature | refactor | bugfix | config) — a single taxonomy, not the
        # prior docs/deps/code/infra second taxonomy.
        description: "Novelty (0.0-1.0; higher = more unprecedented). Suggested by change_type: config≈0.3, bugfix≈0.5, refactor≈0.7, feature≈0.85."
      complexity_score:
        type: number
        default: 0.75
        description: "Complexity (0.0-1.0). HIGHER = SIMPLER. Floor 0.5 is IMMUTABLE. Derivation: max(0.5, 1.0 - (files * modules / 100))."
      quality_score:
        type: number
        default: 0.85
        description: "Quality (0.0-1.0). Threshold 0.7. No subscore may be 0.0."
      api_url:
        type: string
        default: "https://api.aegis.undercurrentholdings.com"
        description: "AEGIS REST API base URL. Custom domain by default; raw Cloud Run URL is internal-only."
      agent_id:
        type: string
        default: "github-actions"
        description: "Caller identifier for AEGIS audit trail."
    secrets:
      AEGIS_API_KEY:
        required: true
        description: "Unkey Bearer token for AEGIS REST API."

permissions:
  contents: read
  actions: read   # §51: referenced_workflows API fallback in resolve_callee (cross-repo self-checkout)
  checks: write   # github-script Checks-API attach + composite STEP_SUMMARY
  # QG48-5: NO pull-requests:write — no step writes PR comments (intentionally minimal scope).

jobs:
  aegis-gate:
    name: AEGIS Governance Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    continue-on-error: ${{ inputs.shadow_mode }}
    steps:
      # === BEGIN cross-repo workflow_call self-checkout resolver ===
      # Resolves the callee's (aegis-policy) repo + commit SHA for self-checkout.
      # CRITICAL for cross-repo workflow_call (the Sprint 7/G2-G3 consumer path):
      # the previous `uses: ./.github/actions/aegis-gate` resolved the composite
      # against the CALLER's checked-out workspace (which lacks it), failing with
      # "Can't find 'action.yml' under .../.github/actions/aegis-gate" — the
      # §48.16.3 cross-repo `./` action-resolution bug (same class as §37.17/§37.18;
      # caught via closed PR #196). aegis-policy's own LOCAL consumption
      # (uses: ./.github/workflows/aegis-enforce.yml) resolves through the SAME
      # path (job.workflow_* → aegis-policy@<sha>), so one pattern serves both
      # local + cross-repo callers.
      #
      # Why github.workflow_* does NOT work here: in cross-repo workflow_call the
      # `github` context is the CALLER's (github/gh-aw #24918; cosmic-flute §37.17).
      # Defense-in-depth (cosmic-flute §37.18.3 + §51): PRIMARY job.workflow_*
      # (cloud) + FALLBACK referenced_workflows API (GHES). The resolve_callee
      # body below is parity-locked byte-for-byte against
      # .github/scripts/resolve_callee.mjs (the Node-tested ESM module) via the
      # resolve-callee-parity CI gate — shared across this workflow AND
      # aegis-verify-attestation.yml (REUSABLE_WORKFLOW_FILENAME-parameterized).
      - name: Resolve callee workflow ref (cross-repo workflow_call)
        id: resolve_callee
        # C3 (cosmic-flute §45.12.5.3): refactored to use env:-passed
        # job.workflow_* values instead of `${{ toJSON(...) }}` template
        # expressions inside the script body. Reason: enables byte-for-byte
        # parity between this inline body and .github/scripts/resolve_callee.mjs
        # (the standalone ESM module that the Node test harness imports).
        # Template expressions inside script: bodies cannot be byte-identical
        # to a plain .mjs file. Env-var injection preserves semantics +
        # makes the body pure JS that runs identically in both contexts.
        env:
          # job.workflow_* per Contexts reference §job (cloud-only; returns
          # callee values for cross-repo workflow_call). GHES fallback in body.
          JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          # §51: filename for the SELF_REGEX referenced_workflows match (shared
          # resolver parameterized per-consumer; QG48-D8 single-resolver design).
          REUSABLE_WORKFLOW_FILENAME: aegis-enforce.yml
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // PRIMARY path: GitHub.com cloud — job.workflow_* returns callee values.
            // Read from env vars injected by step's env: block.
            const jobRepo = process.env.JOB_WORKFLOW_REPOSITORY || '';
            const jobSha = process.env.JOB_WORKFLOW_SHA || '';

            let resolvedRepo = jobRepo;
            let resolvedRef = jobSha;
            let resolutionPath = 'job.workflow_*';

            if (!jobRepo || !jobSha) {
              // FALLBACK: GHES (where job.workflow_* unavailable) or future
              // regression. Mirrors gh-aw PR #24974 + canonical/get-
              // workflow-version-action production pattern.
              core.info('job.workflow_repository or job.workflow_sha empty (GHES?) — falling back to referenced_workflows API');

              const callerOwner = context.repo.owner;
              const callerRepo = context.repo.repo;
              const runId = parseInt(process.env.GITHUB_RUN_ID, 10);

              if (!Number.isFinite(runId)) {
                throw new Error('GITHUB_RUN_ID invalid; cannot resolve callee via referenced_workflows API');
              }

              const run = await github.rest.actions.getWorkflowRun({
                owner: callerOwner,
                repo: callerRepo,
                run_id: runId,
              });

              const referenced = run.data.referenced_workflows || [];
              core.info(`Found ${referenced.length} referenced_workflows entries`);

              // Find the entry matching THIS reusable workflow's filename via
              // an ANCHORED regex (not substring `.includes()`) to prevent
              // longer-path forgery — e.g., a malicious nested
              // `attacker/repo/.github/workflows/aegis-verify-attestation.yml.evil/inner.yml`
              // would have matched the previous `.includes('/.github/workflows/aegis-
              // verify-attestation.yml')` substring filter. The anchored regex
              // consolidates the substring filter + downstream owner/repo
              // extraction into a single safe pass.
              // /quality-gate QG-§37.18 Phase 2 cycle 1 finding F1.1 (MEDIUM/C2;
              // defense-in-depth — referenced_workflows is server-computed so
              // forgery is theoretical, but cheap to harden).
              //
              // U1+U2 (cosmic-flute §45.12.5.3 + §37.18.16) + §51/QG48-D8: the
              // filename is supplied by the caller workflow via the
              // REUSABLE_WORKFLOW_FILENAME env var (NOT hardcoded) so this single
              // resolver is shared byte-for-byte across BOTH reusable workflows that
              // need cross-repo self-checkout — aegis-verify-attestation.yml AND
              // aegis-enforce.yml — with no duplicate-resolver drift magnet. The
              // Node test harness sets this env var per-consumer; the parity CI gate
              // diffs BOTH inline bodies against this .mjs marker region.
              //
              // Path format (per GitHub REST API):
              //   <owner>/<repo>/.github/workflows/<file>.yml@<ref>
              // The optional `@<ref>` suffix appears for cross-repo references.
              const REUSABLE_WORKFLOW_FILENAME = process.env.REUSABLE_WORKFLOW_FILENAME || '';
              if (!REUSABLE_WORKFLOW_FILENAME) {
                throw new Error('REUSABLE_WORKFLOW_FILENAME env var not set; cannot build SELF_REGEX (caller workflow step must set it in env:)');
              }
              const SELF_REGEX = new RegExp(
                `^([^/]+)/([^/]+)/\\.github/workflows/${REUSABLE_WORKFLOW_FILENAME.replace(/\./g, '\\.')}(?:@.*)?$`,
              );
              // Collect ALL matches (not just first) to detect multi-match
              // ambiguity per /quality-gate Phase 3 /ultrathink U6 (MEDIUM/C2):
              // GitHub API does not guarantee referenced_workflows[] ordering.
              // If two entries point at the same path with different SHAs
              // (rare but possible in nested workflow_call chains where the
              // same reusable workflow is invoked at multiple SHAs), picking
              // the FIRST returned would be non-deterministic. Throw with full
              // disambiguation context so the caller can pin explicitly.
              const matches = [];
              for (const wf of referenced) {
                const m = wf.path.match(SELF_REGEX);
                if (m) {
                  matches.push({ entry: wf, owner: m[1], repo: m[2] });
                }
              }
              if (matches.length === 0) {
                throw new Error(
                  `No referenced_workflows entry matched ${REUSABLE_WORKFLOW_FILENAME} (anchored regex). ` +
                  `Searched ${referenced.length} entries. Paths: ` +
                  JSON.stringify(referenced.map((w) => w.path)),
                );
              }
              if (matches.length > 1) {
                // Allow multi-match ONLY if all entries point at the same
                // (owner, repo, sha) — that's a benign duplicate. Otherwise
                // throw with disambiguation context.
                const dedupeKey = (mm) => `${mm.owner}/${mm.repo}@${mm.entry.sha || mm.entry.ref}`;
                const uniqueKeys = [...new Set(matches.map(dedupeKey))];
                if (uniqueKeys.length > 1) {
                  throw new Error(
                    `Multiple ${REUSABLE_WORKFLOW_FILENAME} referenced_workflows entries found with DIFFERENT (owner, repo, sha) tuples — cannot deterministically resolve callee. ` +
                    `GitHub API does not guarantee referenced_workflows[] ordering, so picking the first would be non-deterministic. ` +
                    `Distinct callee tuples: ${JSON.stringify(uniqueKeys)}. ` +
                    `Resolution: pin caller-side, or file aegis-policy issue with the caller's workflow context.`,
                  );
                }
                core.info(`Multi-match with identical (owner,repo,sha) tuple (${uniqueKeys[0]}); resolving deterministically.`);
              }
              const matchingEntry = matches[0].entry;
              const matchedOwner = matches[0].owner;
              const matchedRepo = matches[0].repo;

              resolvedRepo = `${matchedOwner}/${matchedRepo}`;
              // Prefer immutable SHA over mutable ref (gh-aw #24974 — resists
              // branch drift during long-running jobs).
              //
              // U9/F1.3 (cosmic-flute §45.12.5.3 + §37.18.16): when .sha is
              // empty AND .ref is present, the silent fallback proceeds with
              // a mutable ref. Emit a core.warning so operators can request
              // the caller pin by commit SHA. Closes the "silent .ref fallback"
              // observability gap.
              if (!matchingEntry.sha) {
                core.warning(
                  `referenced_workflows entry has no immutable .sha; falling back to mutable .ref="${matchingEntry.ref}". ` +
                  `Caller may have pinned this reusable workflow by branch/tag rather than commit SHA — ` +
                  `request the caller pin by commit SHA per cosmic-flute §35.5 best practice.`,
                );
              }
              resolvedRef = matchingEntry.sha || matchingEntry.ref;
              resolutionPath = 'referenced_workflows-API';
            }

            core.info(`Resolved callee via ${resolutionPath}: ${resolvedRepo}@${resolvedRef}`);
            core.setOutput('repository', resolvedRepo);
            core.setOutput('ref', resolvedRef);
            core.setOutput('resolution_path', resolutionPath);

      - name: Checkout aegis-policy at the resolved callee ref
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          repository: ${{ steps.resolve_callee.outputs.repository }}
          ref: ${{ steps.resolve_callee.outputs.ref }}
          path: aegis-policy
      # === END cross-repo workflow_call self-checkout resolver ===

      - name: Evaluate via AEGIS composite action
        id: aegis
        uses: ./aegis-policy/.github/actions/aegis-gate
        with:
          api_key: ${{ secrets.AEGIS_API_KEY }}
          api_url: ${{ inputs.api_url }}
          proposal_summary: ${{ inputs.proposal_summary }}
          estimated_impact: ${{ inputs.estimated_impact }}
          change_type: ${{ inputs.change_type }}
          risk_score: ${{ inputs.risk_proposed }}
          risk_baseline: ${{ inputs.risk_baseline }}
          profit_proposed: ${{ inputs.profit_proposed }}
          profit_baseline: ${{ inputs.profit_baseline }}
          novelty_score: ${{ inputs.novelty_score }}
          complexity_score: ${{ inputs.complexity_score }}
          quality_score: ${{ inputs.quality_score }}
          agent_id: ${{ inputs.agent_id }}
          # In shadow mode, never fail on HALT (let workflow continue-on-error swallow it).
          # In enforcing mode, fail on HALT so the workflow exits non-zero and blocks merge.
          fail_on_halt: ${{ inputs.shadow_mode == false }}

      - name: Attach AEGIS verdict as Checks API run
        if: always()
        # §51 QG-cycle-1 (I-2): unified to the SAME v9.0.0 SHA the resolve_callee
        # step uses (the Octokit checks.* calls are action-major-independent; this
        # eliminates the v9/v7 skew + Dependabot double-bump noise in the single
        # public enforcement workflow).
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AEGIS_STATUS: ${{ steps.aegis.outputs.status }}
          AEGIS_CONFIDENCE: ${{ steps.aegis.outputs.confidence }}
          AEGIS_RATIONALE: ${{ steps.aegis.outputs.rationale }}
          AEGIS_DECISION_JSON: ${{ steps.aegis.outputs.decision_json }}
          SHADOW_MODE: ${{ inputs.shadow_mode }}
        with:
          script: |
            const status = (process.env.AEGIS_STATUS || 'error').toLowerCase();
            const shadow = process.env.SHADOW_MODE === 'true';
            const confidence = process.env.AEGIS_CONFIDENCE || 'N/A';
            const rationale = process.env.AEGIS_RATIONALE || 'No rationale provided.';

            // Map AEGIS verdict to GitHub Checks API conclusion.
            // In shadow mode HALT becomes 'neutral' (advisory) so the check does not
            // surface as a failure in the PR merge UI; in enforcing mode HALT is 'failure'.
            const conclusionMap = {
              proceed:  'success',
              pause:    'neutral',
              escalate: 'neutral',
              halt:     shadow ? 'neutral' : 'failure',
              error:    'neutral',
            };
            const conclusion = conclusionMap[status] || 'neutral';

            const modeLabel = shadow ? '[SHADOW]' : '[ENFORCING]';
            const title = `AEGIS ${modeLabel}: ${status.toUpperCase()} (confidence ${confidence})`;

            // Include decision_json in summary as fenced JSON for the user to inspect.
            let summary = `**Rationale**: ${rationale}\n\n`;
            const decisionJson = process.env.AEGIS_DECISION_JSON;
            if (decisionJson) {
              summary += `<details><summary>Full decision JSON</summary>\n\n\`\`\`json\n${decisionJson}\n\`\`\`\n\n</details>`;
            }

            // QG48-13: published Checks-API run name disambiguated from the
            // REQUIRED status check `aegis-gate / AEGIS Governance Gate` (the
            // job-resolved name enforced by org-Ruleset 17101026). Near-identical
            // names invited a misconfig where this advisory detail-run could be
            // marked required instead of the real gating check.
            const CHECK_NAME = 'AEGIS Governance (advisory verdict detail)';

            // QG48-11: dedup + try/catch. List existing runs for this SHA+name and
            // UPDATE rather than stacking a new run on every re-run; wrap so a
            // transient Checks-API failure degrades gracefully (the workflow
            // summary + step outputs still carry the verdict) instead of failing
            // this always() step.
            try {
              const { data: existing } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                check_name: CHECK_NAME,
              });
              const runs = (existing && existing.check_runs) || [];
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: 'completed',
                conclusion: conclusion,
                output: { title: title, summary: summary },
              };
              if (runs.length > 0) {
                await github.rest.checks.update({ ...payload, check_run_id: runs[0].id });
                core.info(`Updated existing "${CHECK_NAME}" check run ${runs[0].id}: ${conclusion}`);
              } else {
                await github.rest.checks.create({ ...payload, name: CHECK_NAME, head_sha: context.sha });
                core.info(`Created "${CHECK_NAME}" check run: ${conclusion}`);
              }
            } catch (e) {
              core.warning(`Failed to attach the AEGIS verdict as a Checks API run: ${e.message}. The workflow summary + step outputs still carry the verdict.`);
            }

      - name: Workflow summary
        if: always()
        shell: bash
        env:
          AEGIS_STATUS: ${{ steps.aegis.outputs.status }}
          AEGIS_CONFIDENCE: ${{ steps.aegis.outputs.confidence }}
          AEGIS_RATIONALE: ${{ steps.aegis.outputs.rationale }}
          SHADOW_MODE: ${{ inputs.shadow_mode }}
        run: |
          # §51 QG-cycle-1 (completes QG48-10): collapse newlines + escape `|` so
          # untrusted rationale cannot break the markdown table or inject extra rows.
          # Mirrors the composite's action.yml escape — this duplicate summary
          # location in the reusable workflow was missed in §51 Commit 2.
          RATIONALE_MD=$(printf '%s' "${AEGIS_RATIONALE:-N/A}" | tr '\n' ' ' | sed 's/|/\\|/g')
          {
            echo "## AEGIS Governance Gate"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Status** | \`${AEGIS_STATUS:-error}\` |"
            echo "| **Confidence** | ${AEGIS_CONFIDENCE:-N/A} |"
            echo "| **Mode** | ${SHADOW_MODE} (true = advisory, false = enforcing) |"
            echo "| **Rationale** | ${RATIONALE_MD} |"
            echo ""
            if [ "${SHADOW_MODE}" = "true" ]; then
              echo "_Shadow mode: advisory only, does not block merge regardless of verdict._"
            else
              echo "_Enforcing mode: HALT verdict blocks merge._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
