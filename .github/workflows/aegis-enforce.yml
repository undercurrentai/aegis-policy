# AEGIS Governance Gate (Reusable Workflow)
#
# Companion to .github/actions/aegis-gate composite action. Wraps the composite
# call in a reusable workflow so other repos can invoke a single canonical
# evaluation pipeline + Checks API attachment via `uses:` from their own
# workflows.
#
# RELOCATED 2026-05-31 from PRIVATE aegis-governance to PUBLIC aegis-policy (the
# §48 enforce-substrate single source of truth). A PUBLIC caller repo cannot
# call a PRIVATE repo's reusable workflow (GitHub platform restriction), so the
# substrate lives here; aegis-policy consumes it locally via `./` while
# aegis-governance (private) + all G2/G3 consumers call it cross-repo via
# undercurrentai/aegis-policy/...@<SHA> (private/internal -> public is ALLOWED).
# Supersedes PR #190's substrate location. The composite is referenced locally
# as ./.github/actions/aegis-gate. See cosmic-flute §48 + the
# aegis-enforce-caller.yml relocation-pivot header.
#
# Usage from a calling repo (e.g., undercurrent-core, libertas-cicd, AgoraIV):
#
#   jobs:
#     ci-success:
#       runs-on: ubuntu-latest
#       needs: [lint, test, security]
#       steps:
#         - run: echo "All CI checks passed"
#
#     aegis-gate:
#       uses: undercurrentai/aegis-policy/.github/workflows/aegis-enforce.yml@<SHA>
#       needs: [ci-success]
#       if: needs.ci-success.result == 'success'
#       secrets: inherit
#       with:
#         shadow_mode: true          # flip to false once calibrated (≥20 PRs, ≥50% PROCEED)
#         proposal_summary: "${{ github.event.pull_request.title }}"
#         estimated_impact: "medium"
#         change_type: "feature"
#         # Parameter derivation defaults below encode the §48 enforce-substrate CI/CD-domain profile.
#         # Calling repos may override for richer accuracy.
#
# Branch-protection required-status-check name: "aegis-gate / AEGIS Governance Gate"
#   (GitHub renders required checks as "<job-id> / <job-name>" for reusable workflows.)
#
# Phase rollout (§48 calibration window; shadow_mode true -> false):
#   - shadow_mode=true  + continue-on-error -> calibration window (~20 PRs minimum)
#   - shadow_mode=false                     -> enforcement (HALT blocks merge)

name: AEGIS Governance Gate (Reusable)

on:
  workflow_call:
    inputs:
      shadow_mode:
        type: boolean
        default: true
        description: "true = advisory (continue-on-error). false = enforcing (HALT blocks merge)."
      proposal_summary:
        type: string
        required: true
        description: "Brief description of the proposed change. Typically the PR title."
      estimated_impact:
        type: string
        default: "medium"
        description: "low | medium | high | critical"
      change_type:
        type: string
        default: "feature"
        description: "feature | refactor | bugfix | config"
      risk_baseline:
        type: number
        default: 0.02
        description: "Baseline risk (0.0-1.0). CI/CD-domain default per the §48 enforce-substrate calibration defaults."
      risk_proposed:
        type: number
        default: 0.04
        description: "Proposed risk (0.0-1.0). Suggested derivation: 0.02 + files_changed * 0.002."
      profit_baseline:
        type: number
        default: 0.98
        description: "Baseline test pass rate (0.0-1.0)."
      profit_proposed:
        type: number
        default: 0.98
        description: "Proposed test pass rate (0.0-1.0). Default assumes no regression."
      novelty_score:
        type: number
        default: 0.85
        description: "Novelty (0.0-1.0). By change_type: docs=skip, config=0.3, deps=0.5, code=0.85, infra=0.95."
      complexity_score:
        type: number
        default: 0.75
        description: "Complexity (0.0-1.0). HIGHER = SIMPLER. Floor 0.5 is IMMUTABLE. Derivation: max(0.5, 1.0 - (files * modules / 100))."
      quality_score:
        type: number
        default: 0.85
        description: "Quality (0.0-1.0). Threshold 0.7. No subscore may be 0.0."
      api_url:
        type: string
        default: "https://api.aegis.undercurrentholdings.com"
        description: "AEGIS REST API base URL. Custom domain by default; raw Cloud Run URL is internal-only."
      agent_id:
        type: string
        default: "github-actions"
        description: "Caller identifier for AEGIS audit trail."
    secrets:
      AEGIS_API_KEY:
        required: true
        description: "Unkey Bearer token for AEGIS REST API."

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  aegis-gate:
    name: AEGIS Governance Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    continue-on-error: ${{ inputs.shadow_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Evaluate via AEGIS composite action
        id: aegis
        uses: ./.github/actions/aegis-gate
        with:
          api_key: ${{ secrets.AEGIS_API_KEY }}
          api_url: ${{ inputs.api_url }}
          proposal_summary: ${{ inputs.proposal_summary }}
          estimated_impact: ${{ inputs.estimated_impact }}
          change_type: ${{ inputs.change_type }}
          risk_score: ${{ inputs.risk_proposed }}
          risk_baseline: ${{ inputs.risk_baseline }}
          profit_proposed: ${{ inputs.profit_proposed }}
          profit_baseline: ${{ inputs.profit_baseline }}
          novelty_score: ${{ inputs.novelty_score }}
          complexity_score: ${{ inputs.complexity_score }}
          quality_score: ${{ inputs.quality_score }}
          agent_id: ${{ inputs.agent_id }}
          # In shadow mode, never fail on HALT (let workflow continue-on-error swallow it).
          # In enforcing mode, fail on HALT so the workflow exits non-zero and blocks merge.
          fail_on_halt: ${{ inputs.shadow_mode == false }}

      - name: Attach AEGIS verdict as Checks API run
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          AEGIS_STATUS: ${{ steps.aegis.outputs.status }}
          AEGIS_CONFIDENCE: ${{ steps.aegis.outputs.confidence }}
          AEGIS_RATIONALE: ${{ steps.aegis.outputs.rationale }}
          AEGIS_DECISION_JSON: ${{ steps.aegis.outputs.decision_json }}
          SHADOW_MODE: ${{ inputs.shadow_mode }}
        with:
          script: |
            const status = (process.env.AEGIS_STATUS || 'error').toLowerCase();
            const shadow = process.env.SHADOW_MODE === 'true';
            const confidence = process.env.AEGIS_CONFIDENCE || 'N/A';
            const rationale = process.env.AEGIS_RATIONALE || 'No rationale provided.';

            // Map AEGIS verdict to GitHub Checks API conclusion.
            // In shadow mode HALT becomes 'neutral' (advisory) so the check does not
            // surface as a failure in the PR merge UI; in enforcing mode HALT is 'failure'.
            const conclusionMap = {
              proceed:  'success',
              pause:    'neutral',
              escalate: 'neutral',
              halt:     shadow ? 'neutral' : 'failure',
              error:    'neutral',
            };
            const conclusion = conclusionMap[status] || 'neutral';

            const modeLabel = shadow ? '[SHADOW]' : '[ENFORCING]';
            const title = `AEGIS ${modeLabel}: ${status.toUpperCase()} (confidence ${confidence})`;

            // Include decision_json in summary as fenced JSON for the user to inspect.
            let summary = `**Rationale**: ${rationale}\n\n`;
            const decisionJson = process.env.AEGIS_DECISION_JSON;
            if (decisionJson) {
              summary += `<details><summary>Full decision JSON</summary>\n\n\`\`\`json\n${decisionJson}\n\`\`\`\n\n</details>`;
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'AEGIS Governance',
              head_sha: context.sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: title,
                summary: summary,
              },
            });

            core.info(`AEGIS verdict attached as Checks API run: ${conclusion}`);

      - name: Workflow summary
        if: always()
        shell: bash
        env:
          AEGIS_STATUS: ${{ steps.aegis.outputs.status }}
          AEGIS_CONFIDENCE: ${{ steps.aegis.outputs.confidence }}
          AEGIS_RATIONALE: ${{ steps.aegis.outputs.rationale }}
          SHADOW_MODE: ${{ inputs.shadow_mode }}
        run: |
          {
            echo "## AEGIS Governance Gate"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Status** | \`${AEGIS_STATUS:-error}\` |"
            echo "| **Confidence** | ${AEGIS_CONFIDENCE:-N/A} |"
            echo "| **Mode** | ${SHADOW_MODE} (true = advisory, false = enforcing) |"
            echo "| **Rationale** | ${AEGIS_RATIONALE:-N/A} |"
            echo ""
            if [ "${SHADOW_MODE}" = "true" ]; then
              echo "_Shadow mode: advisory only, does not block merge regardless of verdict._"
            else
              echo "_Enforcing mode: HALT verdict blocks merge._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
