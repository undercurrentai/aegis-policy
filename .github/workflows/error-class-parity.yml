name: Error-class Parity

# Cross-checks `policy/verifier-policy-v1.yaml fail_closed_on` against the latest
# `aegis-governance[verify]` SDK's emitted error_class set. Fails the PR if either
# side has a member the other lacks.
#
# Closes the manual-audit gap from cosmic-flute §26.11 step 4. Without this
# automation, drift between SDK error_class taxonomy and policy fail_closed_on
# could silently propagate to all 19 consumer repos.

on:
  pull_request:
    branches:
      - main
    paths:
      - "policy/verifier-policy-v1.yaml"
      - "scripts/check_error_class_parity.py"
      - "scripts/_verify_local_vendored.py"
      - ".github/workflows/error-class-parity.yml"
      - "requirements-dev.txt"
  push:
    branches:
      - main
    paths:
      - "policy/verifier-policy-v1.yaml"
      - "scripts/check_error_class_parity.py"
      - "scripts/_verify_local_vendored.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: SDK ↔ policy error_class parity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install dev deps
        # Note: no liboqs install needed — the parity check AST-walks the
        # vendored `_verify_local.py` source file directly and never imports
        # the SDK. See scripts/check_error_class_parity.py module docstring
        # for why we vendor (aegis-governance>=0.5.0 not on PyPI; source
        # repo is private).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run parity check
        run: python scripts/check_error_class_parity.py
