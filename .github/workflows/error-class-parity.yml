name: Error-class Parity

# Cross-checks `policy/verifier-policy-v1.yaml fail_closed_on` against the
# error_class set of the VENDORED SDK snapshot (scripts/_verify_local_vendored.py,
# pinned at the Source SHA in its header) — NOT the installed SDK. Fails the PR
# if either side has a member the other lacks. The verifier-kit job runs the
# exact-pinned PyPI SDK, so vendored-ref drift is a real window: it is
# re-checked manually on every deliberate SDK pin bump (1.0.0→1.4.0 proven
# formatting-only, 2026-07-30) until the roadmapped check_vendored_source_sha
# guard (§26.17 FU-3) machine-checks it.
#
# Closes the manual-audit gap from cosmic-flute §26.11 step 4. Without this
# automation, drift between SDK error_class taxonomy and policy fail_closed_on
# could silently propagate to all 19 consumer repos.

on:
  pull_request:
    branches:
      - main
    # NO `paths:` filter — deliberately, per cosmic-flute §48.15 R2, the same
    # anti-skipped-check-hang rule aegis-enforce-caller.yml already carries:
    # this job is a REQUIRED status check in org ruleset 16294975, and a
    # required check that never reports sits at "Expected" forever. The old
    # filter made every PR touching none of the filtered paths structurally
    # unmergeable in-band — verified on #33, #34 (docs-only) and #35
    # (.github/scripts + a workflow not in the filter), each missing 2 of 5
    # required checks. The job is ~8s and asserts a repo-state invariant, so
    # it passes on any PR regardless of what that PR changed. Guarded by
    # tests/test_workflow_invariants.py::TestRequiredCheckWorkflowsHaveNoPathsFilter.
  push:
    branches:
      - main
    # push keeps its path scope: post-merge visibility for direct/admin pushes
    # that touch the gate's inputs. Only the pull_request side is a required
    # check, so only it must be unconditional. "Inputs" includes the workflow
    # file itself and both dependency files (the lockfile is what the job
    # installs; the dev file is its source) — mirroring fingerprint-parity.
    paths:
      - "policy/verifier-policy-v1.yaml"
      - "scripts/check_error_class_parity.py"
      - "scripts/_verify_local_vendored.py"
      - ".github/workflows/error-class-parity.yml"
      - "requirements-dev.txt"
      - "requirements-ci.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: SDK ↔ policy error_class parity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Measured runtime ~8s; the job now runs on EVERY PR (required check), so
    # an unbounded hang would burn the 360-minute default on a billed runner.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install dev deps (hash-pinned)
        # Note: no liboqs install needed — the parity check AST-walks the
        # vendored `_verify_local.py` source file directly and never imports
        # the SDK. See scripts/check_error_class_parity.py module docstring.
        #
        # requirements-ci.txt is the hash-pinned lockfile compiled from the
        # dev requirements — see its header for the threat model and the
        # regeneration command. No `pip install --upgrade pip` either: that
        # was itself an unpinned live-PyPI install, the class this closes.
        # --only-binary=:all: closes the hashed-sdist fallback (build deps
        # would arrive unpinned from live PyPI); see tests.yml for detail.
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-ci.txt
          python -m pip check

      - name: Run parity check
        run: python scripts/check_error_class_parity.py
