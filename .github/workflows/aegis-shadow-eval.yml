name: AEGIS Shadow Evaluation

# Self-dogfood: every PR to this repo invokes AEGIS Stage-2 evaluation.
# Advisory only — never blocks. Posts decision_id as a PR comment for audit.
# Mirrors the aegis-governance/.github/workflows/python-ci.yml shadow-eval pattern.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # Note: previous version included `pull-requests: write` for "posting
  # decision_id comment", but the workflow only writes to GITHUB_STEP_SUMMARY
  # (Actions UI summary), NOT to PR comments. Least-privilege: dropped.
  # If a future iteration adds an actions/github-script step that posts a
  # PR comment, restore `pull-requests: write` then.

jobs:
  shadow-eval:
    name: AEGIS Shadow Evaluation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # NB: was advisory-only at Sprint 5/E1 design; promoted to REQUIRED via
    # Sprint 5/E1.5 Phase 7 org-Ruleset `aegis-attestation-required-checks`
    # (id 16294975). Check context must match the ruleset's required_status_checks
    # entry "AEGIS Shadow Evaluation" exactly — the prior "(advisory)" suffix
    # caused a check-name mismatch that blocked PR #5 admin-squash-merge until
    # this rename.
    #
    # HONESTY NOTE on continue-on-error (v1.4.1 audit): job-level
    # continue-on-error greens the workflow RUN but the JOB check-run still
    # concludes `failure`, and the ruleset gates on the job check-run — so it
    # protects nothing against an API outage (aegis-enforce.yml documents the
    # same from live debugging). The ACTUAL outage protection is the script's
    # unconditional exit 0. Residual: a checkout or hash-pinned-install step
    # failure (PyPI outage, wheel yank) still reddens this required check with
    # no recourse but re-run — accepted, same class as every other required
    # check's install step. continue-on-error retained only as belt-and-braces.
    continue-on-error: true
    # Required check (org ruleset 16294975) — bound the billed-runner ceiling.
    timeout-minutes: 10
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # skip on forks (no secret access)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install minimal deps (hash-pinned)
        # requirements-aux-ci.txt is the hash-pinned lockfile for the CI jobs
        # whose tooling must stay OUT of the test venv — see its header. Bare
        # `pip install httpx` was a latest-version live-PyPI resolution on a
        # REQUIRED check; one bad upstream release reddens every open PR.
        run: |
          python -m pip install --no-deps --require-hashes --only-binary=:all: -r requirements-aux-ci.txt
          python -m pip check

      - name: Submit AEGIS Stage-2 evaluation
        env:
          AEGIS_API_KEY: ${{ secrets.AEGIS_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python <<'PY'
          import os, sys, httpx, json
          api_key = os.environ.get("AEGIS_API_KEY", "").strip()
          if not api_key:
              print("::warning::AEGIS shadow-eval DEGRADED — AEGIS_API_KEY not configured")
              gh = os.environ.get("GITHUB_STEP_SUMMARY")
              if gh:
                  with open(gh, "a") as f:
                      f.write("## AEGIS Shadow Evaluation\n\n- **Status**: `DEGRADED (no API key; no decision recorded)`\n")
              sys.exit(0)
          payload = {
              "proposal_summary": f"PR #{os.environ['PR_NUM']}: {os.environ['PR_TITLE']}",
              "estimated_impact": "low",  # aegis-policy is governance-only; consumer impact via SHA-pin
              "risk_baseline": 0.05,
              "risk_proposed": 0.05,
          }
          def degraded(reason):
              # A dead advisory lane must be VISIBLE without becoming blocking:
              # every failure path here exits 0 (advisory by contract), so the
              # only honest signal is an annotation + a degraded step summary —
              # otherwise the decision-audit trail can stop silently while the
              # required check stays green (the absence-of-signal class this
              # repo keeps re-learning).
              print(f"::warning::AEGIS shadow-eval DEGRADED — {reason}")
              gh_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if gh_summary:
                  with open(gh_summary, "a") as f:
                      f.write(f"## AEGIS Shadow Evaluation\n\n- **Status**: `DEGRADED (no decision recorded)`\n- **Reason**: `{reason}`\n")
              sys.exit(0)
          try:
              # Custom domain per org convention (aegis-governance G74/v4.7.15):
              # remote callers use api.aegis.undercurrentholdings.com; the raw
              # Cloud Run URL is internal-only (deploy probes). The sibling
              # aegis-enforce.yml already defaults to the custom domain.
              r = httpx.post(
                  "https://api.aegis.undercurrentholdings.com/evaluate",
                  json=payload,
                  headers={"Authorization": f"Bearer {api_key}"},
                  timeout=30.0,
              )
              r.raise_for_status()
              data = r.json()
              decision_id = data.get("decision_id", "<missing>")
              status = data.get("status", "<unknown>")
              print(f"AEGIS decision_id={decision_id} status={status}")
              # Write to GH step summary for PR comment integration
              gh_summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if gh_summary:
                  with open(gh_summary, "a") as f:
                      f.write(f"## AEGIS Shadow Evaluation\n\n- **Status**: `{status}`\n- **Decision ID**: `{decision_id}`\n")
          except Exception as e:
              degraded(f"evaluate call failed: {e}")
          PY
