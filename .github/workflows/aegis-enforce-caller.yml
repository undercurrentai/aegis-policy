# AEGIS Enforce Caller — Sprint 7/G1 SP2 (cosmic-flute §48.15 + relocation pivot) — aegis-policy LOCAL consumer
#
# RELOCATION PIVOT (2026-05-31): the §48 enforce substrate (aegis-enforce.yml
# reusable workflow + aegis-gate composite action) was RELOCATED from PRIVATE
# aegis-governance to PUBLIC aegis-policy. Root cause: a PUBLIC caller repo
# CANNOT call a PRIVATE repo's reusable workflow (GitHub platform restriction;
# the called repo's `access_level` does NOT override it; masks as the error
# "workflow was not found"). aegis-policy (public) therefore hosts the SINGLE
# SOURCE OF TRUTH for the §48 substrate and consumes its own copy here via the
# local `./.github/workflows/aegis-enforce.yml` reference. aegis-governance
# (private) + all future G2/G3 consumer repos call it cross-repo via
# `undercurrentai/aegis-policy/.github/workflows/aegis-enforce.yml@<SHA>`
# (private/internal caller -> public callee is ALLOWED). Supersedes PR #190's
# substrate location (which placed aegis-enforce.yml in aegis-governance).
# Emits the resolved check `aegis-gate / AEGIS Governance Gate` (per GitHub Docs
# reusable-workflow naming: `<caller-job-id> / <reusable-job-name>`) —
# byte-identical across all source + consumer callers.
#
# Required-status-check target (org-Ruleset 17XXX, populated in §48 SP5 after
# SP3 measures the resolved check name empirically): `aegis-gate / AEGIS Governance Gate`.
#
# Phase rollout (per docs/integration/dogfooding-guide.md):
#   - shadow_mode: true  + continue-on-error in aegis-enforce.yml -> advisory; HALT does not block merge
#   - shadow_mode: false                                          -> enforcing; HALT blocks merge
#
# Per cosmic-flute §48.15 R2 (anti-skipped-check-hang per GitHub Docs +
# community #54877): NO `paths:` filter on `pull_request`. Required status checks
# must fire on every PR including docs-only PRs — otherwise the check stays
# "Waiting for status to be reported" and the PR cannot merge once the ruleset
# requires the check.
#
# Per cosmic-flute §48.15 R3: the job key `aegis-gate` is load-bearing. It
# MUST be identical across the aegis-governance SP1 caller and this aegis-policy
# §48 SP2 caller so the resolved required-check string is uniform across all
# Sprint 7 source + consumer repos. Single org-Ruleset entry covers all.

name: AEGIS Enforce (caller)

on:
  pull_request:
    branches: [main, master]
  merge_group:

concurrency:
  group: aegis-enforce-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write         # aegis-enforce.yml posts to Checks API (cycle-2 fix: reusable workflow effective perms = INTERSECTION of caller + reusable; missing this caused startup_failure on RUN 26599831374)
  pull-requests: write  # aegis-enforce.yml's composite-action step writes PR comments

jobs:
  aegis-gate:  # R3 (cosmic-flute §48.15): identical job key across aegis-governance + aegis-policy
    # NO `name:` field — GitHub resolves the check-name's left half from the job KEY
    # when no name is set; setting `name:` overrides this. Per §48.15 R3, the resolved
    # check name MUST be `aegis-gate / AEGIS Governance Gate` for uniform ruleset
    # coverage of all consumers. The aegis-governance SP1 self-dogfood caller
    # empirically confirmed (RUN 26600020461) that `name:` takes precedence over
    # job-key, so the cycle-2 fix dropped `name:`; this consumer mirrors that.
    uses: ./.github/workflows/aegis-enforce.yml
    with:
      shadow_mode: true  # advisory; per docs/integration/dogfooding-guide.md calibration window (single source of truth)
      proposal_summary: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message || 'merge-group' }}
      estimated_impact: medium
      change_type: feature
      agent_id: github-actions-aegis-policy-self-dogfood
    secrets: inherit
