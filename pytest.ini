[pytest]
# WHY THIS FILE EXISTS
# --------------------
# `.github/workflows/tests.yml` runs the suite as two jobs that PARTITION it:
# the required matrix job deselects `-m "not needs_aegis_sdk"`, and the
# advisory `verifier-kit` job selects `-m needs_aegis_sdk` (the 19
# tests/test_verify_action.py tests, which need `aegis-governance[verify]`
# installed — public PyPI, pinned in requirements-verify-ci.txt).
#
# The marker (rather than an `--ignore=<path>`) keeps the declaration next to
# the test that owns it: a future SDK-needing test file degrades gracefully
# instead of turning the matrix job red from a workflow its author never
# opened. (A bare `pytest tests/` without the SDK still runs the 19 marked
# tests and fails — deselect locally with `-m "not needs_aegis_sdk"`.)
#
# HISTORY: the marker was born `needs_secrets` (#36), on the premise that the
# SDK was private behind an AEGIS_SDK_FETCH_TOKEN secret. That premise was
# already false when written — the SDK has been on public PyPI since
# 2026-05-15 and the secret never existed — so the name was corrected to what
# the capability actually is.
#
# --strict-markers makes a typo'd marker a collection error rather than a
# silent no-op — a mistyped `needs_aegis_sdks` would otherwise deselect
# nothing and quietly run 19 SDK-needing tests in the SDK-less matrix venv.
addopts = --strict-markers
markers =
    needs_aegis_sdk: requires aegis-governance[verify] installed (see requirements-verify-ci.txt); run by the verifier-kit CI job
