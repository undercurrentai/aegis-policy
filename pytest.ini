[pytest]
# WHY THIS FILE EXISTS
# --------------------
# `.github/workflows/tests.yml` gates the suite on every PR, but one test file
# needs a credential a fork PR cannot have (the private aegis-sdk, behind
# AEGIS_SDK_FETCH_TOKEN). The first cut of that job excluded it by path:
#
#     pytest tests/ --ignore=tests/test_verify_action.py
#
# That is not durable. The next person who adds a secrets-needing test file
# turns the job red-by-default, and the fix lives in a workflow they had no
# reason to open. A marker moves the declaration next to the test that owns it.
#
# It also fixes a smaller papercut: before this, a bare `pytest tests/` on a
# fresh clone failed with 18 errors. Now it passes.
#
# --strict-markers makes a typo'd marker a collection error rather than a
# silent no-op — a mistyped `needs_secret` would otherwise deselect nothing and
# quietly reintroduce the red-by-default problem.
addopts = --strict-markers
markers =
    needs_secrets: requires a credential unavailable on fork PRs (e.g. AEGIS_SDK_FETCH_TOKEN)
